<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms and Privacy — Company Compass</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%230FB981'/%3E%3Ccircle cx='60' cy='60' r='46' stroke='%23FAF9F5' stroke-width='7'/%3E%3Cpolygon points='60,20 82,60 60,60' fill='%23FAF9F5'/%3E%3Cpolygon points='60,100 38,60 60,60' fill='%237C5CFF'/%3E%3Ccircle cx='60' cy='60' r='8' fill='%230FB981' stroke='%23FAF9F5' stroke-width='3'/%3E%3C/svg%3E">
<script src="legal-content.js"></script>
<style>
  :root{ color-scheme: light; --bg:#fbfbfe; --panel:#ffffff; --border:#e7e6f2; --text:#191a23; --muted:#5f6478; --accent:#5b3fe0; }
  @media (prefers-color-scheme: dark){ :root{ color-scheme: dark; --bg:#14151c; --panel:#1b1c26; --border:#2e3040; --text:#eef0fa; --muted:#a3a9c2; --accent:#b4a3ff; } }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;}
  a{color:var(--accent);}
  header{border-bottom:1px solid var(--border);}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px;}
  header .wrap{display:flex;align-items:center;gap:16px;height:60px;}
  header a.home{font-weight:700;color:var(--text);text-decoration:none;}
  header nav{margin-left:auto;display:flex;gap:16px;font-size:.92rem;}
  article{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 32px;margin:28px 0;}
  article h2{margin-top:0;font-size:1.6rem;}
  article h3{font-size:1.05rem;margin:22px 0 6px;}
  article p, article li{color:var(--text);}
  @media (max-width:600px){ article{padding:20px;} }
</style>
</head>
<body>
<header><div class="wrap"><a class="home" href="./">Company Compass</a><nav><a href="#terms">Terms</a><a href="#privacy">Privacy</a><a href="app">Log in</a></nav></div></header>
<main class="wrap">
  <article id="terms"><h2>Terms &amp; Conditions</h2><div id="terms-body"></div></article>
  <article id="privacy"><h2>Privacy Policy</h2><div id="privacy-body"></div></article>
</main>
<script>
  (function(){
    var L = window.CC_LEGAL;
    var missing = '<p>This text could not be loaded. Please refresh the page.</p>';
    document.getElementById('terms-body').innerHTML = L ? L.terms : missing;
    document.getElementById('privacy-body').innerHTML = L ? L.privacy : missing;
    if(location.hash){ var t = document.querySelector(location.hash); if(t) t.scrollIntoView(); }
  })();
</script>
</body>
</html>
