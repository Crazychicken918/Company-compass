<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Compass</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    color-scheme: light;
    --bg:#fbfbfe; --bg-elev:#ffffff; --panel:#ffffff; --panel2:#f5f4ff; --border:#edecf5;
    --text:#191a23; --muted:#797e91; --accent:#7c5cff; --accent-dim:#ece7ff; --accent2:#0fb981;
    --danger:#f4406a; --warn:#f5a524; --radius:14px;
    --shadow:0 1px 2px rgba(30,20,60,.03), 0 6px 18px rgba(30,20,60,.04);
    --c-dashboard:#7c5cff; --c-revenue:#0fb981; --c-expenses:#f4406a; --c-assets:#06b6d4;
    --c-liabilities:#f5a524; --c-clients:#a855f7; --c-invoices:#6366f1; --c-creditnotes:#ec4899;
    --c-payroll:#14b8a6; --c-vat:#fb923c; --c-team:#64748b; --c-reports:#1d4ed8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--accent);}
  button{font-family:inherit;cursor:pointer;transition:opacity .15s ease, transform .1s ease;}
  button:active{transform:scale(.98);}
  input,select,textarea{font-family:inherit;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 10px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .btn{background:var(--accent);border:none;color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;box-shadow:0 4px 12px -4px rgba(124,92,255,.5);}
  .btn:hover{opacity:.9;}
  .btn.secondary{background:var(--bg-elev);color:var(--text);border:1px solid var(--border);box-shadow:none;}
  .btn.secondary:hover{background:var(--panel2);}
  .btn.danger{background:var(--danger);color:#fff;box-shadow:0 4px 12px -4px rgba(244,64,106,.5);}
  .btn.small{padding:5px 10px;font-size:.8rem;}
  .hidden{display:none !important;}

  /* Auth screen */
  #auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;
    background:
      radial-gradient(600px circle at 12% 15%, rgba(124,92,255,.16), transparent 60%),
      radial-gradient(600px circle at 88% 20%, rgba(15,185,129,.14), transparent 60%),
      radial-gradient(600px circle at 50% 95%, rgba(244,64,106,.10), transparent 55%),
      var(--bg);
  }
  #auth-screen::before{content:'';position:absolute;inset:0;background-image:
      linear-gradient(rgba(25,26,35,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(25,26,35,.03) 1px, transparent 1px);
    background-size:36px 36px;mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);pointer-events:none;}
  .auth-wrap{position:relative;z-index:1;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;}
  .auth-badge{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;
    background:linear-gradient(135deg, var(--accent), var(--accent2));box-shadow:0 6px 20px rgba(124,92,255,.35);margin-bottom:18px;}
  .auth-box{background:var(--card,var(--panel));border:1px solid var(--border);border-top:3px solid var(--accent);
    border-radius:20px;padding:34px 28px;width:100%;box-shadow:0 4px 12px rgba(30,20,60,.05), 0 16px 40px rgba(30,20,60,.08);}
  .auth-box h1{font-size:1.4rem;margin-bottom:4px;text-align:center;}
  .auth-box p.tagline{color:var(--muted);margin-top:0;margin-bottom:22px;font-size:.9rem;text-align:center;line-height:1.5;}
  .auth-box form{display:flex;flex-direction:column;gap:10px;}
  .auth-box input{width:100%;}
  .auth-field{position:relative;}
  .auth-field input{width:100%;}
  .auth-field.has-toggle input{padding-right:38px;}
  .pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);
    font-size:.72rem;font-weight:600;letter-spacing:.02em;padding:6px 8px;border-radius:6px;}
  .pw-toggle:hover{color:var(--text);background:var(--panel2);}
  .auth-box .btn{width:100%;padding:11px 16px;font-size:.95rem;}
  .auth-toggle{text-align:center;margin-top:18px;font-size:.85rem;color:var(--muted);}
  .auth-error{color:var(--danger);font-size:.85rem;min-height:18px;}

  /* App shell */
  #app-shell{display:none;min-height:100vh;}
  #app-shell.active{display:flex;}
  #sidebar{width:220px;flex-shrink:0;background:var(--bg-elev);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;}
  #sidebar h2{font-size:1.1rem;margin:4px 8px 2px;}
  #sidebar .company-name{font-size:.78rem;color:var(--muted);margin:0 8px 18px;}
  #sidebar nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  #sidebar nav button{text-align:left;background:none;border:none;color:var(--text);padding:9px 10px;border-radius:10px;font-size:.9rem;display:flex;align-items:center;gap:9px;}
  #sidebar nav button:hover{background:var(--panel2);}
  #sidebar nav button.active{background:var(--panel2);color:var(--dot,var(--accent));font-weight:600;box-shadow:inset 3px 0 0 0 var(--dot);}
  #sidebar nav button .dot{width:8px;height:8px;min-width:8px;border-radius:50%;background:var(--dot,var(--muted));}
  #sidebar nav button[data-view="dashboard"]{--dot:var(--c-dashboard);}
  #sidebar nav button[data-view="revenue"]{--dot:var(--c-revenue);}
  #sidebar nav button[data-view="expenses"]{--dot:var(--c-expenses);}
  #sidebar nav button[data-view="assets"]{--dot:var(--c-assets);}
  #sidebar nav button[data-view="liabilities"]{--dot:var(--c-liabilities);}
  #sidebar nav button[data-view="clients"]{--dot:var(--c-clients);}
  #sidebar nav button[data-view="invoices"]{--dot:var(--c-invoices);}
  #sidebar nav button[data-view="creditnotes"]{--dot:var(--c-creditnotes);}
  #sidebar nav button[data-view="payroll"]{--dot:var(--c-payroll);}
  #sidebar nav button[data-view="vat"]{--dot:var(--c-vat);}
  #sidebar nav button[data-view="reports"]{--dot:var(--c-reports);}
  #sidebar nav button[data-view="team"]{--dot:var(--c-team);}
  #sidebar .logout{margin-top:10px;font-size:.8rem;color:var(--muted);background:none;border:none;text-align:left;padding:9px 10px;}

  #main{flex:1;padding:26px 32px;max-width:1100px;}
  #main h1{margin-top:0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px;}
  .card{background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--accent-c,var(--border));border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .card h3{margin:0 0 6px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .card .value{font-size:1.6rem;font-weight:700;}
  .card .sub{font-size:.8rem;color:var(--muted);margin-top:4px;}
  .value.positive{color:var(--accent2);}
  .value.negative{color:var(--danger);}
  .positive{color:var(--accent2);}
  .negative{color:var(--danger);}
  .tabbar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .period-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;}
  .report-table td{padding:9px 10px;}
  @media print{
    #sidebar, #toast, .tabbar, .period-bar, .section-header .btn{display:none !important;}
    #main{padding:0;max-width:100%;}
    body{background:#fff;}
  }

  table{width:100%;border-collapse:collapse;font-size:.88rem;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;}
  tr:last-child td{border-bottom:none;}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .section-header h1{display:flex;align-items:center;gap:10px;}
  .section-header h1::before{content:'';display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--accent-c,var(--accent));}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);}
  .field input,.field select{min-width:140px;}
  .tag-pill{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:.72rem;margin-right:4px;}
  .status-pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:600;}
  .status-draft{background:var(--panel2);color:var(--muted);}
  .status-sent{background:#e6edff;color:#3757d6;}
  .status-paid{background:#e3faf1;color:#0fb981;}
  .status-overdue{background:#fee9ee;color:var(--danger);}
  .status-pending{background:#fef3de;color:#c9860b;}
  .status-rejected{background:#fee9ee;color:var(--danger);}
  .status-issued{background:#e3faf1;color:#0fb981;}
  .perm-box{border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;margin-top:4px;background:var(--panel2);}
  .perm-box label{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text);font-weight:400;}
  .perm-box input[type="checkbox"]{width:auto;}
  .perm-box hr{width:100%;border:none;border-top:1px solid var(--border);margin:2px 0;}
  .empty{color:var(--muted);font-size:.88rem;padding:16px 0;text-align:center;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(25,26,35,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px -20px rgba(30,20,60,.35);}
  .modal h2{margin-top:0;font-size:1.1rem;}
  .modal .field{width:100%;}
  .modal input,.modal select,.modal textarea{width:100%;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .close-x{float:right;background:none;border:none;color:var(--muted);font-size:1.1rem;}
  .legal-links{text-align:center;font-size:.78rem;color:var(--muted);margin-top:14px;}
  .legal-links a{color:var(--muted);text-decoration:underline;}
  .sidebar-legal-links{margin-top:auto;padding-top:10px;text-align:center;}
  #legal-content h3{margin-top:18px;margin-bottom:6px;}
  #legal-content h3:first-child{margin-top:0;}
  #legal-content p{margin:0 0 10px 0;color:var(--muted);}
  .role-badge{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);}
  .invoice-items-table input{width:100%;}
  #toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:.85rem;z-index:99;display:none;box-shadow:0 8px 24px -8px rgba(30,20,60,.4);}
  .muted-link{color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.8rem;}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-wrap">
    <div class="auth-badge">🧭</div>
    <div class="auth-box">
      <h1 id="auth-heading">Welcome back</h1>
      <p class="tagline" id="auth-tagline">Good to see you — let's get your numbers sorted.</p>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email" required>
        <div class="auth-field has-toggle">
          <input type="password" id="auth-password" placeholder="Password (min 8 characters)" minlength="8" required>
          <button type="button" class="pw-toggle" id="auth-pw-toggle">SHOW</button>
        </div>
        <div id="signup-fields" class="hidden" style="display:flex;flex-direction:column;gap:10px;">
          <input type="text" id="auth-company-name" placeholder="Company name">
          <input type="text" id="auth-vat-number" placeholder="VAT number (optional)">
        </div>
        <div class="auth-error" id="auth-error"></div>
        <button type="submit" class="btn" id="auth-submit">Log In</button>
      </form>
      <div class="auth-toggle">
        <span id="auth-toggle-text">Don't have an account?</span>
        <a href="#" id="auth-toggle-link">Sign up</a>
      </div>
      <div class="legal-links">
        <a href="#" data-open-legal="terms">Terms &amp; Conditions</a> · <a href="#" data-open-legal="privacy">Privacy Policy</a>
      </div>
    </div>
  </div>
</div>

<div id="app-shell">
  <div id="sidebar">
    <h2>Company Compass</h2>
    <div class="company-name" id="sidebar-company-name">Loading…</div>
    <nav id="nav">
      <button data-view="dashboard" class="active"><span class="dot"></span>Dashboard</button>
      <button data-view="revenue"><span class="dot"></span>Revenue</button>
      <button data-view="expenses"><span class="dot"></span>Expenses</button>
      <button data-view="assets"><span class="dot"></span>Assets</button>
      <button data-view="liabilities"><span class="dot"></span>Liabilities</button>
      <button data-view="clients"><span class="dot"></span>Clients</button>
      <button data-view="invoices"><span class="dot"></span>Invoices</button>
      <button data-view="creditnotes"><span class="dot"></span>Credit Notes</button>
      <button data-view="payroll"><span class="dot"></span>Payroll</button>
      <button data-view="vat"><span class="dot"></span>VAT</button>
      <button data-view="reports"><span class="dot"></span>Reports</button>
      <button data-view="team"><span class="dot"></span>Team</button>
    </nav>
    <div class="legal-links sidebar-legal-links">
      <a href="#" data-open-legal="terms">Terms</a> · <a href="#" data-open-legal="privacy">Privacy</a>
    </div>
    <button class="logout" id="logout-btn">Log out</button>
  </div>
  <div id="main"></div>
</div>

<div class="modal-backdrop hidden" id="legal-modal-backdrop"><div class="modal" style="max-width:640px;">
  <button class="close-x" id="legal-modal-close">✕</button>
  <div class="tabbar" style="margin-bottom:12px;">
    <button class="btn small" id="legal-tab-terms" data-legal-tab="terms">Terms &amp; Conditions</button>
    <button class="btn secondary small" id="legal-tab-privacy" data-legal-tab="privacy">Privacy Policy</button>
  </div>
  <div id="legal-content" style="font-size:.86rem;line-height:1.6;color:var(--text);"></div>
</div></div>

<div id="toast"></div>

<script>
/* ========================= CONFIG ========================= */
const SUPABASE_URL = 'https://fejcuijyskosvdxkgupo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__WQYy168UXfdP4WmZOFQPQ_asRpInsR';
const VAT_RATE = 0.15; // South Africa standard VAT rate

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const chartInstances = {};
function makeChart(canvasId, config){
  const canvas = document.getElementById(canvasId);
  if(!canvas || typeof Chart === 'undefined') return;
  if(chartInstances[canvasId]){ chartInstances[canvasId].destroy(); delete chartInstances[canvasId]; }
  chartInstances[canvasId] = new Chart(canvas.getContext('2d'), config);
}
function last6MonthsRange(){
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const start = d.toISOString().slice(0,10);
    const end = new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10);
    months.push({label: d.toLocaleString(undefined,{month:'short',year:'2-digit'}), start, end});
  }
  return months;
}

/* ========================= STATE ========================= */
let state = {
  user: null,
  company: null,      // {id, name, vat_number, registration_number, owner_id}
  membership: null,   // {role, status}
  members: [],
  accounts: [],
  entries: [],
  assets: [],
  liabilities: [],
  clients: [],
  invoices: [],
  invoiceItems: {},   // invoiceId -> items[]
  creditNotes: [],
  creditNoteItems: {}, // creditNoteId -> items[]
  employees: [],
  payrollPayments: [],
  employeeTasks: [],
  view: 'dashboard',
  reportsTab: 'pl',
  reportsPeriod: {mode:'month'}
};

function fmt(n){
  n = Number(n)||0;
  return 'R' + n.toLocaleString('en-ZA', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.display='none'; }, 3000);
}
function isAdmin(){
  return state.membership && (state.membership.role === 'owner' || state.membership.role === 'admin');
}
function isStaff(){
  return state.membership && state.membership.role === 'staff';
}
function hasModule(mod){
  const m = state.membership;
  if(!m) return false;
  if(m.role === 'owner' || m.role === 'admin') return true;
  if(m.role === 'staff') return Array.isArray(m.permissions && m.permissions.modules) && m.permissions.modules.includes(mod);
  return false;
}
function canApprove(){
  const m = state.membership;
  if(!m) return false;
  if(m.role === 'owner' || m.role === 'admin') return true;
  if(m.role === 'staff') return !!(m.permissions && m.permissions.can_approve);
  return false;
}
function roleLabel(m){
  if(m.role === 'owner') return 'Owner';
  if(m.role === 'admin') return 'Management';
  if(m.role === 'viewer') return 'Viewer';
  if(m.role === 'staff'){
    const mods = (m.permissions && m.permissions.modules) || [];
    const approve = m.permissions && m.permissions.can_approve;
    return 'Staff' + (mods.length ? ' · ' + mods.map(moduleLabel).join(', ') : '') + (approve ? ' · can approve' : '');
  }
  return m.role;
}
const MODULE_LABELS = {revenue:'Revenue', expenses:'Expenses', assets:'Assets', liabilities:'Liabilities', clients:'Clients', invoices:'Invoices', credit_notes:'Credit Notes', payroll:'Payroll'};
function moduleLabel(k){ return MODULE_LABELS[k] || k; }

/* ========================= AUTH ========================= */
let authMode = 'login';

document.getElementById('auth-toggle-link').addEventListener('click', (e)=>{
  e.preventDefault();
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('signup-fields').classList.toggle('hidden', authMode === 'login');
  document.getElementById('auth-submit').textContent = authMode === 'login' ? 'Log In' : 'Sign Up';
  document.getElementById('auth-heading').textContent = authMode === 'login' ? 'Welcome back' : 'Let\'s get set up';
  document.getElementById('auth-tagline').textContent = authMode === 'login' ? 'Good to see you — let\'s get your numbers sorted.' : 'A couple of details and your dashboard is ready.';
  document.getElementById('auth-toggle-text').textContent = authMode === 'login' ? "Don't have an account?" : 'Already have an account?';
  document.getElementById('auth-toggle-link').textContent = authMode === 'login' ? 'Sign up' : 'Log in';
  document.getElementById('auth-error').textContent = '';
});

document.getElementById('auth-pw-toggle').addEventListener('click', ()=>{
  const pwInput = document.getElementById('auth-password');
  const btn = document.getElementById('auth-pw-toggle');
  const show = pwInput.type === 'password';
  pwInput.type = show ? 'text' : 'password';
  btn.textContent = show ? 'HIDE' : 'SHOW';
});

document.getElementById('auth-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  try{
    if(authMode === 'login'){
      const {error} = await sb.auth.signInWithPassword({email, password});
      if(error) throw error;
    } else {
      const companyName = document.getElementById('auth-company-name').value.trim();
      const vatNumber = document.getElementById('auth-vat-number').value.trim();
      if(!companyName){ errEl.textContent = 'Company name is required.'; return; }
      localStorage.setItem('cc_pending_signup_'+email, JSON.stringify({companyName, vatNumber}));
      const {data, error} = await sb.auth.signUp({email, password});
      if(error) throw error;
      // Company + membership are created once the session is confirmed (see onAuthReady)
      pendingSignup = {companyName, vatNumber};
    }
  } catch(err){
    errEl.textContent = err.message || 'Something went wrong.';
  }
});

let pendingSignup = null;

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  window.location.reload();
});

/* ========================= LEGAL: TERMS & PRIVACY ========================= */
const LEGAL_LAST_UPDATED = 'September 2026';
const TERMS_HTML = `
  <p style="color:var(--muted);font-size:.78rem;">Last updated: ${LEGAL_LAST_UPDATED}</p>
  <h3>1. Acceptance of these Terms</h3>
  <p>By creating an account or using Company Compass ("the App"), you agree to these Terms &amp; Conditions on behalf of yourself and, where applicable, the company that invited you. If you don't agree, please don't use the App.</p>
  <h3>2. What the App is</h3>
  <p>Company Compass is a business finance record-keeping and reporting tool. It helps you capture revenue, expenses, assets, liabilities, invoices, credit notes, payroll and related management reports (including P&amp;L, balance sheet, cash flow, budgets and ratios) for your company.</p>
  <h3>3. Not financial, tax or legal advice</h3>
  <p>Reports, figures and calculations produced by the App (including VAT estimates, depreciation, ratios and management accounts) are provided for convenience and internal planning only. They are not a substitute for advice from a qualified accountant, tax practitioner or legal advisor, and should be independently reviewed before being relied on for statutory filings (e.g. VAT201 returns) or other official purposes.</p>
  <h3>4. Accounts, roles and access</h3>
  <p>Access is by invitation from a company administrator. Management-level users can configure roles and module-level permissions for staff; each user is responsible for keeping their own login credentials confidential and for activity carried out under their account.</p>
  <h3>5. Your data and content</h3>
  <p>You and your company retain ownership of the financial data, documents and records you enter into or upload to the App. You're responsible for the accuracy of what you enter, and for having the right to upload any documents (such as signed financial statements) that you store in the App.</p>
  <h3>6. Acceptable use</h3>

sb.auth.onAuthStateChange((event, session)=>{
  if(session && session.user){
    onAuthReady(session.user);
  } else {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-shell').classList.remove('active');
  }
});

async function createCompanyForUser(companyName, vatNumber){
  const {data: company, error: cErr} = await sb.from('cc_companies').insert({
    owner_id: state.user.id, name: companyName, vat_number: vatNumber || null
  }).select().single();
  if(cErr) throw cErr;
  await sb.from('cc_company_members').insert({
    company_id: company.id, user_id: state.user.id, email: state.user.email, role: 'owner', status: 'active'
  });
  return company;
}

async function onAuthReady(user){
  state.user = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-shell').classList.add('active');

  // Handle brand-new signup: create company + owner membership.
  // Falls back to localStorage in case email confirmation caused a reload
  // between signup and the first authenticated session.
  let signupInfo = pendingSignup;
  if(!signupInfo){
    const stored = localStorage.getItem('cc_pending_signup_'+user.email);
    if(stored){ try{ signupInfo = JSON.parse(stored); }catch(e){} }
  }
  if(signupInfo){
    pendingSignup = null;
    localStorage.removeItem('cc_pending_signup_'+user.email);
    const {data: existing} = await sb.from('cc_company_members').select('id').eq('user_id', user.id).limit(1);
    if(!existing || existing.length === 0){
      try{ await createCompanyForUser(signupInfo.companyName, signupInfo.vatNumber); }catch(e){ console.error(e); }
    }
  }

  // Link any pending invite for this email
  await sb.from('cc_company_members')
    .update({user_id: user.id, status: 'active'})
    .eq('email', user.email)
    .eq('status', 'pending');

  await loadCompany();
}

async function loadCompany(){
  const {data: memberships} = await sb.from('cc_company_members')
    .select('*').eq('user_id', state.user.id).eq('status', 'active').limit(1);

  if(!memberships || memberships.length === 0){
    document.getElementById('main').innerHTML = `<div class="panel"><h2>No company found</h2>
      <p class="empty">Your account isn't linked to a company yet. If you were invited, ask the company owner to check the email address used to invite you (${state.user.email}). If you signed up directly, try logging out and back in.</p></div>`;
    return;
  }
  state.membership = memberships[0];
  const {data: company} = await sb.from('cc_companies').select('*').eq('id', state.membership.company_id).single();
  state.company = company;
  document.getElementById('sidebar-company-name').textContent = company.name + (isAdmin() ? '' : ' (' + roleLabel(state.membership).toLowerCase() + ')');

  await refreshAll();
  render();
}

async function refreshAll(){
  const cid = state.company.id;
  const [members, accounts, entries, assets, liabilities, clients, invoices, creditNotes, employees, payments, tasks] = await Promise.all([
    sb.from('cc_company_members').select('*').eq('company_id', cid),
    sb.from('cc_accounts').select('*').eq('company_id', cid),
    sb.from('cc_entries').select('*').eq('company_id', cid).order('entry_date', {ascending:false}),
    sb.from('cc_assets').select('*').eq('company_id', cid),
    sb.from('cc_liabilities').select('*').eq('company_id', cid),
    sb.from('cc_clients').select('*').eq('company_id', cid),
    sb.from('cc_invoices').select('*').eq('company_id', cid).order('issue_date', {ascending:false}),
    sb.from('cc_credit_notes').select('*').eq('company_id', cid).order('issue_date', {ascending:false}),
    sb.from('cc_employees').select('*').eq('company_id', cid),
    sb.from('cc_payroll_payments').select('*').eq('company_id', cid).order('pay_date', {ascending:false}),
    sb.from('cc_employee_tasks').select('*').eq('company_id', cid).order('created_at', {ascending:false})
  ]);
  state.members = members.data || [];
  state.accounts = accounts.data || [];
  state.entries = entries.data || [];
  state.assets = assets.data || [];
  state.liabilities = liabilities.data || [];
  state.clients = clients.data || [];
  state.invoices = invoices.data || [];
  state.creditNotes = creditNotes.data || [];
  state.employees = employees.data || [];
  state.payrollPayments = payments.data || [];
  state.employeeTasks = tasks.data || [];

  const invoiceIds = state.invoices.map(i=>i.id);
  const creditNoteIds = state.creditNotes.map(cn=>cn.id);
  const [invItemsRes, cnItemsRes] = await Promise.all([
    invoiceIds.length ? sb.from('cc_invoice_items').select('*').in('invoice_id', invoiceIds) : Promise.resolve({data:[]}),
    creditNoteIds.length ? sb.from('cc_credit_note_items').select('*').in('credit_note_id', creditNoteIds) : Promise.resolve({data:[]})
  ]);
  state.invoiceItems = {};
  (invItemsRes.data||[]).forEach(it=>{ (state.invoiceItems[it.invoice_id] = state.invoiceItems[it.invoice_id]||[]).push(it); });
  state.creditNoteItems = {};
  (cnItemsRes.data||[]).forEach(it=>{ (state.creditNoteItems[it.credit_note_id] = state.creditNoteItems[it.credit_note_id]||[]).push(it); });
}

/* ========================= CALCULATIONS ========================= */
function totalsFor(){
  const revenue = state.entries.filter(e=>e.type==='revenue').reduce((s,e)=>s+Number(e.amount),0);
  const expenses = state.entries.filter(e=>e.type==='expense').reduce((s,e)=>s+Number(e.amount),0);
  const startingBalance = state.accounts.reduce((s,a)=>s+Number(a.starting_balance||0),0);
  const payrollPaid = state.payrollPayments.filter(p=>p.paid).reduce((s,p)=>s+Number(p.net),0);
  const predictedBalance = startingBalance + revenue - expenses - payrollPaid;
  const totalAssets = state.assets.reduce((s,a)=>s+Number(a.value),0);
  const totalLiabilities = state.liabilities.reduce((s,l)=>s+Number(l.amount),0);
  const netWorth = totalAssets + predictedBalance - totalLiabilities;
  return {revenue, expenses, predictedBalance, totalAssets, totalLiabilities, netWorth, payrollPaid};
}

function vatFor(asOf){
  const inRange = e => !asOf || e.entry_date <= asOf;
  const vatCollected = state.entries.filter(e=>e.type==='revenue' && e.vat_applicable && inRange(e))
    .reduce((s,e)=> s + Number(e.amount) - Number(e.amount)/(1+VAT_RATE), 0);
  const vatPaid = state.entries.filter(e=>e.type==='expense' && e.vat_applicable && inRange(e))
    .reduce((s,e)=> s + Number(e.amount) - Number(e.amount)/(1+VAT_RATE), 0);
  return {vatCollected, vatPaid, vatPayable: vatCollected - vatPaid};
}

function attachEntryHandlers(type){
  const addBtn = document.getElementById('add-entry-btn');
  const backdrop = document.getElementById('entry-modal-backdrop');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      document.getElementById('entry-date').value = new Date().toISOString().slice(0,10);
      backdrop.classList.remove('hidden');
    });
  }
  document.getElementById('entry-cancel')?.addEventListener('click', ()=>backdrop.classList.add('hidden'));
  document.getElementById('entry-modal-close')?.addEventListener('click', ()=>backdrop.classList.add('hidden'));
  document.getElementById('entry-recurring')?.addEventListener('change', (e)=>{
    document.getElementById('entry-recurrence-field').classList.toggle('hidden', !e.target.checked);
  });
  document.getElementById('entry-form')?.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const tags = document.getElementById('entry-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const isRecurring = document.getElementById('entry-recurring').checked;
    const payload = {
      company_id: state.company.id,
      type,
      description: document.getElementById('entry-description').value.trim(),
      amount: parseFloat(document.getElementById('entry-amount').value),
      entry_date: document.getElementById('entry-date').value,
      tags,
      vat_applicable: document.getElementById('entry-vat').checked,
      is_recurring: isRecurring,
      recurrence_frequency: isRecurring ? document.getElementById('entry-recurrence-frequency').value : null,
      created_by: state.user.id
    };
    if(type==='revenue'){
      const clientId = document.getElementById('entry-client').value;
      if(clientId) payload.client_id = clientId;

function assetMonthlyDepreciation(a){
  if(a.is_current || !a.useful_life_months) return null;
  const depreciable = Number(a.value) - Number(a.residual_value||0);
  return depreciable > 0 ? depreciable / a.useful_life_months : 0;
}
function assetNBV(a){ return Number(a.value) - Number(a.accumulated_depreciation||0); }

      const today = todayIso();
      const {error: entryError} = await sb.from('cc_entries').insert({
        company_id: state.company.id,
        type: 'expense',
        description: `Depreciation — ${asset.description}`,
        amount,
        entry_date: today,
        expense_category: 'operating',

/* ========================= INVOICES ========================= */
function nextInvoiceNumber(){
  const year = new Date().getFullYear();
  const nums = state.invoices
    .map(i=>i.invoice_number)
    .filter(n=>n && n.startsWith('INV-'+year))
    .map(n=>parseInt(n.split('-').pop())||0);
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `INV-${year}-${String(next).padStart(3,'0')}`;
}

function addMonthsIso(dateStr, months){
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + months);
  return d.toISOString().slice(0,10);
}
function nextRecurrenceDate(fromDateStr, frequency){
  if(!fromDateStr) return null;
  switch(frequency){
    case 'weekly': {
      const d = new Date(fromDateStr + 'T00:00:00');
      d.setDate(d.getDate() + 7);
      return d.toISOString().slice(0,10);
    }
    case 'quarterly': return addMonthsIso(fromDateStr, 3);
    case 'annually': return addMonthsIso(fromDateStr, 12);
    case 'monthly':
    default: return addMonthsIso(fromDateStr, 1);
  }
}
async function generateDueRecurringInvoices(){
  if(!canApprove() && !hasModule('invoices')) return; // only attempt if this user could plausibly create invoices
  const today = new Date().toISOString().slice(0,10);
  const due = state.invoices.filter(i=>
    i.is_recurring &&
    i.recurrence_next_date &&
    i.recurrence_next_date <= today &&
    (!i.recurrence_end_date || i.recurrence_next_date <= i.recurrence_end_date)
  );
  if(!due.length) return;
  for(const src of due){
    // Fetch the source invoice's line items to copy across.
    const {data: srcItems} = await sb.from('cc_invoice_items').select('*').eq('invoice_id', src.id);
    const approvalStatus = canApprove() ? 'approved' : 'pending';
    const {data: created, error} = await sb.from('cc_invoices').insert({
      company_id: state.company.id,
      client_id: src.client_id,
      invoice_number: nextInvoiceNumber(),
      issue_date: src.recurrence_next_date,
      due_date: src.due_date ? (()=>{
        const dayOffset = Math.round((new Date(src.due_date+'T00:00:00') - new Date(src.issue_date+'T00:00:00')) / (1000*60*60*24));
        const d = new Date(src.recurrence_next_date + 'T00:00:00');
        d.setDate(d.getDate() + dayOffset);
        return d.toISOString().slice(0,10);
      })() : null,
      status: 'draft',
      notes: src.notes,
      created_by: src.created_by,
      approval_status: approvalStatus,
      is_recurring: false,
      recurrence_frequency: null,
      recurrence_next_date: null,
      recurrence_end_date: null
    }).select().single();
    if(error || !created) continue;
    if(srcItems && srcItems.length){
      await sb.from('cc_invoice_items').insert(srcItems.map(it=>({
        invoice_id: created.id,
        description: it.description,
        quantity: it.quantity,
        unit_price: it.unit_price,
        vat_applicable: it.vat_applicable
      })));
    }
    // Advance the source invoice's schedule so it isn't regenerated on the next refresh.
    const advanced = nextRecurrenceDate(src.recurrence_next_date, src.recurrence_frequency);
    const stillActive = !src.recurrence_end_date || advanced <= src.recurrence_end_date;
    await sb.from('cc_invoices').update({
      recurrence_next_date: stillActive ? advanced : null,
      is_recurring: stillActive
    }).eq('id', src.id);
    state.invoices.push(created);
    state.invoiceItems[created.id] = srcItems || [];
  }
}
function canManageDoc(doc){
  return canApprove() || (doc.created_by === state.user.id && doc.approval_status === 'pending');

function approvalPill(doc){
  if(doc.approval_status === 'pending') return `<span class="status-pill status-pending">pending approval</span>`;
  if(doc.approval_status === 'rejected') return `<span class="status-pill status-rejected">rejected</span>`;
  return '';
}

      recurrence_frequency: isRecurring ? frequency : null,
      recurrence_next_date: isRecurring ? nextRecurrenceDate(issueDate, frequency) : null,

      invoice_id: invoice.id,
      description: tr.querySelector('.ii-desc').value.trim(),
      quantity: parseFloat(tr.querySelector('.ii-qty').value)||1,
      unit_price: parseFloat(tr.querySelector('.ii-price').value)||0,
      vat_applicable: tr.querySelector('.ii-vat').checked
    })).filter(r=>r.description);
    if(rows.length) await sb.from('cc_invoice_items').insert(rows);
    await refreshAll(); render();
    toast(approvalStatus === 'pending' ? 'Invoice submitted for approval.' : 'Invoice created.');
  });
  document.querySelectorAll('[data-del-invoice]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Delete this invoice?')) return;
      const {error} = await sb.from('cc_invoices').delete().eq('id', btn.dataset.delInvoice);
      if(error){ toast(error.message); return; }
      await refreshAll(); render();
    });
  });
  document.querySelectorAll('[data-view-invoice]').forEach(btn=>{
    btn.addEventListener('click', ()=>openInvoiceView(btn.dataset.viewInvoice));

  state.invoices.forEach(async (inv)=>{
    const {data: items} = await sb.from('cc_invoice_items').select('*').eq('invoice_id', inv.id);
    state.invoiceItems[inv.id] = items || [];
    const total = (items||[]).reduce((s,it)=>s+it.quantity*it.unit_price,0);
    const el = document.getElementById('inv-total-'+inv.id);
    if(el) el.textContent = fmt(total);
  });
}

/* ========================= CREDIT NOTES ========================= */
function nextCreditNoteNumber(){
  const year = new Date().getFullYear();
  const nums = state.creditNotes
    .map(n=>n.credit_note_number)
    .filter(n=>n && n.startsWith('CN-'+year))
    .map(n=>parseInt(n.split('-').pop())||0);
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `CN-${year}-${String(next).padStart(3,'0')}`;
}

/* ========================= REPORTS (P&L / BALANCE SHEET / RATIOS) ========================= */
function todayIso(){ return new Date().toISOString().slice(0,10); }
function fmtPct(x){ return (x===null||x===undefined||!isFinite(x)) ? '—' : (x*100).toFixed(1)+'%'; }
function fmtRatio(x){ return (x===null||x===undefined||!isFinite(x)) ? '—' : x.toFixed(2); }

function periodRange(mode){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const iso = d => d.toISOString().slice(0,10);
  if(mode==='month'){ return {start: iso(new Date(y,m,1)), end: iso(new Date(y,m+1,0))}; }
  if(mode==='quarter'){ const q = Math.floor(m/3); return {start: iso(new Date(y,q*3,1)), end: iso(new Date(y,q*3+3,0))}; }
  if(mode==='year'){ return {start: iso(new Date(y,0,1)), end: iso(new Date(y,11,31))}; }
  return {start: '2000-01-01', end: iso(now)}; // 'all'
}
function currentPeriod(){
  const rp = state.reportsPeriod || {mode:'month'};
  if(rp.mode === 'custom'){
    const end = rp.end || todayIso();
    const start = rp.start || end;
    return {start, end};
  }
  return periodRange(rp.mode || 'month');
}
function periodModeLabel(m){ return {month:'This Month', quarter:'This Quarter', year:'This Year', all:'All Time'}[m] || m; }

function computePL(start, end){
  const inRange = e => e.entry_date >= start && e.entry_date <= end;
  const revenue = state.entries.filter(e=>e.type==='revenue' && inRange(e)).reduce((s,e)=>s+Number(e.amount),0);
  const expenseRows = state.entries.filter(e=>e.type==='expense' && inRange(e));
  const cos = expenseRows.filter(e=>e.expense_category==='cost_of_sales').reduce((s,e)=>s+Number(e.amount),0);
  const opex = expenseRows.filter(e=>e.expense_category!=='cost_of_sales').reduce((s,e)=>s+Number(e.amount),0);
  const payrollCost = state.payrollPayments.filter(p=>p.paid && p.pay_date>=start && p.pay_date<=end).reduce((s,p)=>s+Number(p.net),0);
  const grossProfit = revenue - cos;
  const totalOpex = opex + payrollCost;
  const netProfit = grossProfit - totalOpex;
  return {
    start, end, revenue, cos, opex, payrollCost, totalOpex, grossProfit, netProfit,
    grossMargin: revenue ? grossProfit/revenue : null,
    netMargin: revenue ? netProfit/revenue : null
  };
}

function docTotal(items){ return (items||[]).reduce((s,it)=>s+Number(it.quantity)*Number(it.unit_price),0); }

function computeBS(asOf){
  const upTo = d => d <= asOf;
  const revenue = state.entries.filter(e=>e.type==='revenue' && upTo(e.entry_date)).reduce((s,e)=>s+Number(e.amount),0);
  const expenses = state.entries.filter(e=>e.type==='expense' && upTo(e.entry_date)).reduce((s,e)=>s+Number(e.amount),0);
  const startingBalance = state.accounts.reduce((s,a)=>s+Number(a.starting_balance||0),0);
  const payrollPaid = state.payrollPayments.filter(p=>p.paid && upTo(p.pay_date)).reduce((s,p)=>s+Number(p.net),0);
  const cash = startingBalance + revenue - expenses - payrollPaid;

  const arInvoices = state.invoices.filter(i=> i.approval_status==='approved' && (i.status==='sent'||i.status==='overdue') && upTo(i.issue_date));
  const accountsReceivableGross = arInvoices.reduce((s,i)=>s+docTotal(state.invoiceItems[i.id]),0);
  const issuedCreditNotes = state.creditNotes.filter(cn=> cn.approval_status==='approved' && cn.status==='issued' && upTo(cn.issue_date));
  const creditNoteTotal = issuedCreditNotes.reduce((s,cn)=>s+docTotal(state.creditNoteItems[cn.id]),0);
  const accountsReceivable = Math.max(0, accountsReceivableGross - creditNoteTotal);

  const v = vatFor(asOf);
  const vatPayableAmt = Math.max(0, v.vatPayable);
  const vatReceivableAmt = Math.max(0, -v.vatPayable);

  const otherCurrentAssets = state.assets.filter(a=>a.is_current).reduce((s,a)=>s+Number(a.value),0);
  const inventoryValue = state.assets.filter(a=>a.is_current && /stock|inventory/i.test(a.category||'')).reduce((s,a)=>s+Number(a.value),0);
  const fixedAssets = state.assets.filter(a=>!a.is_current).reduce((s,a)=>s+assetNBV(a),0);

  const currentAssets = cash + accountsReceivable + otherCurrentAssets + vatReceivableAmt;
  const totalAssets = currentAssets + fixedAssets;

  const currentLiabOther = state.liabilities.filter(l=>l.is_current).reduce((s,l)=>s+Number(l.amount),0);
  const nonCurrentLiab = state.liabilities.filter(l=>!l.is_current).reduce((s,l)=>s+Number(l.amount),0);
  const currentLiabilities = currentLiabOther + vatPayableAmt;
  const totalLiabilities = currentLiabilities + nonCurrentLiab;

  const equity = totalAssets - totalLiabilities;

  return {
    asOf, cash, accountsReceivable, vatReceivableAmt, otherCurrentAssets, currentAssets, fixedAssets, totalAssets,
    vatPayableAmt, currentLiabOther, currentLiabilities, nonCurrentLiab, totalLiabilities, equity, inventoryValue
  };
}

function computeRatios(pl, bs){
  const div = (a,b) => (!b) ? null : a/b;
  const quickAssets = bs.currentAssets - bs.inventoryValue;
  return {
    grossMargin: pl.grossMargin,
    netMargin: pl.netMargin,
    currentRatio: div(bs.currentAssets, bs.currentLiabilities),
    quickRatio: div(quickAssets, bs.currentLiabilities),
    workingCapital: bs.currentAssets - bs.currentLiabilities,
    debtToEquity: div(bs.totalLiabilities, bs.equity),
    debtRatio: div(bs.totalLiabilities, bs.totalAssets),
    roa: div(pl.netProfit, bs.totalAssets),
    roe: div(pl.netProfit, bs.equity)
  };
}

function dayBeforeIso(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}
function computeCashFlow(start, end){
  const inRange = (d) => d && d >= start && d <= end;

  // Operating activities — cash-basis revenue and expenses recorded in the period,
  // plus payroll actually paid in the period.
  const cashFromRevenue = state.entries.filter(e=>e.type==='revenue' && inRange(e.entry_date)).reduce((s,e)=>s+Number(e.amount),0);
  const expenseRows = state.entries.filter(e=>e.type==='expense' && inRange(e.entry_date));
  const cosOut = expenseRows.filter(e=>e.expense_category==='cost_of_sales').reduce((s,e)=>s+Number(e.amount),0);
  const opexOut = expenseRows.filter(e=>e.expense_category!=='cost_of_sales').reduce((s,e)=>s+Number(e.amount),0);
  const payrollOut = state.payrollPayments.filter(p=>p.paid && inRange(p.pay_date)).reduce((s,p)=>s+Number(p.net),0);
  const netOperating = cashFromRevenue - cosOut - opexOut - payrollOut;

  // Investing activities — assets purchased (cash out) during the period. Only assets
  // with a purchase date recorded are included; older assets without one are excluded.
  const assetPurchases = state.assets.filter(a=>inRange(a.purchase_date)).reduce((s,a)=>s+Number(a.value),0);
  const netInvesting = -assetPurchases;

  // Financing activities — new liabilities drawn down (cash in) during the period,
  // based on each liability's start date.
  const liabilityDraws = state.liabilities.filter(l=>inRange(l.start_date)).reduce((s,l)=>s+Number(l.amount),0);
  const netFinancing = liabilityDraws;

  const netChange = netOperating + netInvesting + netFinancing;
  const openingCash = computeBS(dayBeforeIso(start)).cash;
  const closingCashActual = computeBS(end).cash;
  const closingCashDerived = openingCash + netChange;

  return {
    start, end, cashFromRevenue, cosOut, opexOut, payrollOut, netOperating,
    assetPurchases, netInvesting, liabilityDraws, netFinancing,
    netChange, openingCash, closingCashDerived, closingCashActual,
    reconciles: Math.abs(closingCashDerived - closingCashActual) < 0.01
  };
}

function daysBetween(fromIso, toIso){
  const a = new Date(fromIso + 'T00:00:00'), b = new Date(toIso + 'T00:00:00');
  return Math.round((b - a) / (1000*60*60*24));
}
function agingBucketLabel(daysOverdue){
  if(daysOverdue <= 0) return 'not_due';
  if(daysOverdue <= 30) return '0-30';
  if(daysOverdue <= 60) return '31-60';
  if(daysOverdue <= 90) return '61-90';
  return '90+';
}
function computeARAging(){
  const today = todayIso();
  const rows = state.invoices
    .filter(i=>i.approval_status==='approved' && (i.status==='sent'||i.status==='overdue') && i.due_date)
    .map(i=>{
      const daysOverdue = daysBetween(i.due_date, today);
      const total = docTotal(state.invoiceItems[i.id]);
      return {id:i.id, number:i.invoice_number, client:clientName(i.client_id), due_date:i.due_date, daysOverdue, bucket: agingBucketLabel(daysOverdue), total};
    });
  const buckets = {not_due:0, '0-30':0, '31-60':0, '61-90':0, '90+':0};
  rows.forEach(r=>{ buckets[r.bucket] += r.total; });
  return {rows: rows.sort((a,b)=>b.daysOverdue-a.daysOverdue), buckets};
}
function computeAPAging(){
  const today = todayIso();
  const rows = state.liabilities
    .filter(l=>l.is_current && l.due_date)
    .map(l=>{
      const daysOverdue = daysBetween(l.due_date, today);
      return {id:l.id, description:l.description, due_date:l.due_date, daysOverdue, bucket: agingBucketLabel(daysOverdue), amount:Number(l.amount)};
    });
  const buckets = {not_due:0, '0-30':0, '31-60':0, '61-90':0, '90+':0};
  rows.forEach(r=>{ buckets[r.bucket] += r.amount; });
  return {rows: rows.sort((a,b)=>b.daysOverdue-a.daysOverdue), buckets};
}
function bucketPillClass(bucket){
  if(bucket==='not_due') return 'status-pill status-paid';
  if(bucket==='0-30') return 'status-pill status-pending';
  return 'status-pill status-overdue';
}

    </tbody></table>` : `<div class="empty">No current liabilities with a due date set.</div>`}

  <p style="color:var(--muted);font-size:.8rem;">As of ${todayIso()}. Add a due date to invoices and current liabilities to have them tracked here.</p>

function monthsInPeriod(start, end){
  const s = new Date(start + 'T00:00:00'), e = new Date(end + 'T00:00:00');
  const months = (e.getFullYear()*12 + e.getMonth()) - (s.getFullYear()*12 + s.getMonth()) + 1;
  return Math.max(1, months);
}
function computeBudgetVsActual(start, end){
  const inRange = e => e.entry_date >= start && e.entry_date <= end;
  const months = monthsInPeriod(start, end);
  return state.budgets.map(b=>{
    const actual = state.entries
      .filter(e=>e.type===b.type && inRange(e) && (e.tags||[]).includes(b.tag))
      .reduce((s,e)=>s+Number(e.amount),0);
    const budgeted = Number(b.monthly_amount) * months;
    const pct = budgeted ? actual/budgeted : null;
    return {id:b.id, tag:b.tag, type:b.type, monthlyAmount:Number(b.monthly_amount), budgeted, actual, pct, months};
  }).sort((a,b)=>a.tag.localeCompare(b.tag));
}

    ${rows.length ? rows.map(r=>{

      const pctDisplay = r.pct===null ? '—' : fmtPct(r.pct);
      const barPct = r.pct===null ? 0 : Math.min(100, r.pct*100);
      return `<div class="budget-row">
        <div style="display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:2px;">
          <span style="font-weight:600;">${r.tag} <span class="tag-pill">${r.type}</span></span>
          <span class="${over?'negative':''}">${fmt(r.actual)} / ${fmt(r.budgeted)} (${pctDisplay})</span>
        </div>
        <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${barPct}%;background:${over?'var(--danger)':'var(--accent)'};"></div></div>
        ${canEdit ? `<div style="margin-top:4px;"><button class="btn small secondary" data-del-budget="${r.id}">Remove budget line</button></div>` : ''}
      </div>`;
    }).join('') : `<div class="empty">No budget lines yet. ${canEdit?'Add one above.':'Ask management to set one up.'}</div>`}
  </div>
  <p style="color:var(--muted);font-size:.8rem;">Budgeted amounts are each line's monthly figure × ${monthsInPeriod(start,end)} month(s) in the selected period. Actuals are Revenue/Expense entries in that period tagged with the matching tag.</p>
  `;
}

        <td><button class="btn small secondary" data-view-financial="${s.id}">View</button>${canEdit?` <button class="btn small danger" data-del-financial="${s.id}">Delete</button>`:''}</td></tr>`).join('')}

function renderReports(){
  if(!(isAdmin() || canApprove())){
    return `<h1 style="display:flex;align-items:center;gap:10px;"><span style="width:11px;height:11px;border-radius:3px;background:var(--c-reports);display:inline-block;"></span>Reports</h1>
    <div class="panel"><p class="empty">Management accounts are only visible to management (and staff approved as an accountant).</p></div>`;
  }
  const period = currentPeriod();
  const pl = computePL(period.start, period.end);
  const bs = computeBS(period.end);
  const cf = computeCashFlow(period.start, period.end);
  const ratios = computeRatios(pl, bs);

  return `
    <div class="section-header" style="--accent-c:var(--c-reports);"><h1>Reports</h1><button class="btn secondary" onclick="window.print()">Print / Save PDF</button></div>
    <div class="tabbar">
      <button class="btn ${state.reportsTab==='pl'?'':'secondary'} small" data-report-tab="pl">Profit &amp; Loss</button>
      <button class="btn ${state.reportsTab==='bs'?'':'secondary'} small" data-report-tab="bs">Balance Sheet</button>
      <button class="btn ${state.reportsTab==='cf'?'':'secondary'} small" data-report-tab="cf">Cash Flow</button>
      <button class="btn ${state.reportsTab==='aging'?'':'secondary'} small" data-report-tab="aging">Receivables &amp; Payables</button>
      <button class="btn ${state.reportsTab==='budget'?'':'secondary'} small" data-report-tab="budget">Budget vs Actual</button>
      <button class="btn ${state.reportsTab==='financials'?'':'secondary'} small" data-report-tab="financials">Signed Financials</button>
      <button class="btn ${state.reportsTab==='ratios'?'':'secondary'} small" data-report-tab="ratios">Ratios</button>
    </div>
    <div class="panel period-bar">
      ${['month','quarter','year','all'].map(m=>`<button class="btn ${state.reportsPeriod.mode===m?'':'secondary'} small" data-period-mode="${m}">${periodModeLabel(m)}</button>`).join('')}
      <button class="btn ${state.reportsPeriod.mode==='custom'?'':'secondary'} small" data-period-mode="custom">Custom</button>
      ${state.reportsPeriod.mode==='custom' ? `
        <div class="field"><label>From</label><input type="date" id="reports-custom-start" value="${state.reportsPeriod.start||period.start}"></div>
        <div class="field"><label>To</label><input type="date" id="reports-custom-end" value="${state.reportsPeriod.end||period.end}"></div>
        <button class="btn small" id="reports-custom-apply">Apply</button>
      ` : ''}
      <div style="margin-left:auto;color:var(--muted);font-size:.8rem;align-self:center;">P&amp;L: ${period.start} to ${period.end}<br>Balance sheet as of ${period.end}</div>
    </div>
    ${state.reportsTab==='bs' ? renderBS(bs) : state.reportsTab==='cf' ? renderCF(cf) : state.reportsTab==='aging' ? renderAging(computeARAging(), computeAPAging()) : state.reportsTab==='budget' ? renderBudget(computeBudgetVsActual(period.start, period.end), period.start, period.end) : state.reportsTab==='financials' ? renderFinancials() : state.reportsTab==='ratios' ? renderRatios(ratios, bs) : renderPL(pl)}
  `;
}

function renderPL(pl){
  return `
  <div class="chart-wrap">
    <h3 style="margin-top:0;">P&amp;L breakdown</h3>
    <canvas id="pl-chart" style="height:220px;"></canvas>
  </div>
  <div class="panel">
    <table class="report-table"><tbody>
      <tr><td>Revenue</td><td style="text-align:right;">${fmt(pl.revenue)}</td></tr>
      <tr><td>Cost of Sales</td><td style="text-align:right;">(${fmt(pl.cos)})</td></tr>
      <tr style="font-weight:700;border-top:2px solid var(--border);"><td>Gross Profit</td><td style="text-align:right;">${fmt(pl.grossProfit)}</td></tr>
      <tr><td style="color:var(--muted);font-size:.82rem;">Gross Margin</td><td style="text-align:right;color:var(--muted);font-size:.82rem;">${fmtPct(pl.grossMargin)}</td></tr>
      <tr><td style="padding-top:16px;">Operating Expenses</td><td style="text-align:right;padding-top:16px;">(${fmt(pl.opex)})</td></tr>
      <tr><td>Payroll &amp; Staff Costs</td><td style="text-align:right;">(${fmt(pl.payrollCost)})</td></tr>
      <tr style="font-weight:700;border-top:2px solid var(--border);"><td>Net Profit</td><td style="text-align:right;" class="${pl.netProfit<0?'negative':'positive'}">${fmt(pl.netProfit)}</td></tr>
      <tr><td style="color:var(--muted);font-size:.82rem;">Net Margin</td><td style="text-align:right;color:var(--muted);font-size:.82rem;">${fmtPct(pl.netMargin)}</td></tr>
    </tbody></table>
  </div>
  <p style="color:var(--muted);font-size:.8rem;">Figures are drawn from Revenue and Expense entries dated within the selected period, plus payroll payments marked paid in that period. Not tax advice — confirm with your accountant before relying on these for statutory reporting.</p>
  `;
}

function renderBS(bs){
  return `
  <div class="chart-wrap">
    <h3 style="margin-top:0;">Assets vs Liabilities vs Equity</h3>
    <canvas id="bs-chart" style="height:220px;"></canvas>
  </div>
  <div class="grid">
    <div class="card" style="--accent-c:var(--c-assets);"><h3>Total Assets</h3><div class="value">${fmt(bs.totalAssets)}</div></div>
    <div class="card" style="--accent-c:var(--c-liabilities);"><h3>Total Liabilities</h3><div class="value negative">${fmt(bs.totalLiabilities)}</div></div>
    <div class="card" style="--accent-c:var(--c-dashboard);"><h3>Owner's Equity</h3><div class="value ${bs.equity<0?'negative':'positive'}">${fmt(bs.equity)}</div><div class="sub">Computed: assets − liabilities</div></div>
  </div>
  <div class="panel">
    <h3 style="margin-top:0;">Assets</h3>
    <table class="report-table"><tbody>
      <tr><td>Cash &amp; Bank</td><td style="text-align:right;">${fmt(bs.cash)}</td></tr>
      <tr><td>Accounts Receivable</td><td style="text-align:right;">${fmt(bs.accountsReceivable)}</td></tr>
      ${bs.vatReceivableAmt>0?`<tr><td>VAT Receivable</td><td style="text-align:right;">${fmt(bs.vatReceivableAmt)}</td></tr>`:''}
      <tr><td>Other Current Assets</td><td style="text-align:right;">${fmt(bs.otherCurrentAssets)}</td></tr>
      <tr style="font-weight:600;border-top:1px solid var(--border);"><td>Total Current Assets</td><td style="text-align:right;">${fmt(bs.currentAssets)}</td></tr>
      <tr><td style="padding-top:10px;">Fixed / Non-Current Assets</td><td style="text-align:right;padding-top:10px;">${fmt(bs.fixedAssets)}</td></tr>
      <tr style="font-weight:700;border-top:2px solid var(--border);"><td>Total Assets</td><td style="text-align:right;">${fmt(bs.totalAssets)}</td></tr>
    </tbody></table>
  </div>
  <div class="panel">
    <h3 style="margin-top:0;">Liabilities</h3>
    <table class="report-table"><tbody>
      ${bs.vatPayableAmt>0?`<tr><td>VAT Payable</td><td style="text-align:right;">${fmt(bs.vatPayableAmt)}</td></tr>`:''}
      <tr><td>Other Current Liabilities</td><td style="text-align:right;">${fmt(bs.currentLiabOther)}</td></tr>
      <tr style="font-weight:600;border-top:1px solid var(--border);"><td>Total Current Liabilities</td><td style="text-align:right;">${fmt(bs.currentLiabilities)}</td></tr>
      <tr><td style="padding-top:10px;">Non-Current Liabilities</td><td style="text-align:right;padding-top:10px;">${fmt(bs.nonCurrentLiab)}</td></tr>
      <tr style="font-weight:700;border-top:2px solid var(--border);"><td>Total Liabilities</td><td style="text-align:right;">${fmt(bs.totalLiabilities)}</td></tr>
    </tbody></table>
  </div>
  <div class="panel">
    <h3 style="margin-top:0;">Owner's Equity</h3>
    <table class="report-table"><tbody>
      <tr style="font-weight:700;"><td>Equity (Total Assets − Total Liabilities)</td><td style="text-align:right;" class="${bs.equity<0?'negative':'positive'}">${fmt(bs.equity)}</td></tr>
    </tbody></table>
    <p style="color:var(--muted);font-size:.8rem;margin-bottom:0;">This is a computed balancing figure, not tracked via separate share capital / drawings accounts — treat it as retained earnings plus any capital introduced.</p>
  </div>
  <p style="color:var(--muted);font-size:.8rem;">As at ${bs.asOf}. Fixed assets are shown at net book value (cost less accumulated depreciation) where depreciation has been run under Assets.</p>
  `;
}

function renderRatios(ratios, bs){
  const rows = [
    ['Gross Profit Margin', fmtPct(ratios.grossMargin), 'Gross profit as a % of revenue — how much of each Rand of sales is left after direct costs.'],
    ['Net Profit Margin', fmtPct(ratios.netMargin), 'Net profit as a % of revenue — overall profitability for the period.'],
    ['Current Ratio', fmtRatio(ratios.currentRatio), 'Current assets ÷ current liabilities. Above 1 generally means short-term obligations are covered.'],
    ['Quick Ratio', fmtRatio(ratios.quickRatio), 'Like the current ratio but excludes stock/inventory — a stricter short-term liquidity test.'],
    ['Working Capital', fmt(ratios.workingCapital), 'Current assets minus current liabilities, in Rand.'],
    ['Debt-to-Equity', fmtRatio(ratios.debtToEquity), 'Total liabilities ÷ equity. Higher means more reliance on debt vs. owner funding.'],
    ['Debt Ratio', fmtPct(ratios.debtRatio), 'Total liabilities as a % of total assets.'],
    ['Return on Assets (ROA)', fmtPct(ratios.roa), 'Net profit ÷ total assets for the period — how efficiently assets generate profit. Not annualized.'],
    ['Return on Equity (ROE)', fmtPct(ratios.roe), 'Net profit ÷ equity for the period — return generated on owner funding. Not annualized.']
  ];
  return `
  <div class="panel">
    <table><thead><tr><th>Ratio</th><th>Value</th><th>What it means</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td style="font-weight:600;white-space:nowrap;">${r[0]}</td><td style="white-space:nowrap;">${r[1]}</td><td style="color:var(--muted);font-size:.85rem;">${r[2]}</td></tr>`).join('')}
    </tbody></table>
  </div>
  <p style="color:var(--muted);font-size:.8rem;">Profitability ratios use the P&amp;L period above; liquidity and leverage ratios use the balance sheet as of ${bs.asOf}.</p>
  `;
}

function attachReportsHandlers(){
  const period = currentPeriod();
  if(state.reportsTab==='pl' || !state.reportsTab){
    const pl = computePL(period.start, period.end);
    makeChart('pl-chart', {
      type: 'bar',
      data: {
        labels: ['Revenue','Cost of Sales','Operating Exp.','Payroll','Net Profit'],
        datasets: [{
          label: 'Amount',
          data: [pl.revenue, -pl.cos, -pl.opex, -pl.payrollCost, pl.netProfit],
          backgroundColor: ['#0fb981','#f4406a','#f4406a','#f4406a', pl.netProfit<0?'#f4406a':'#7c5cff']
        }]
      },
      options: {responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}}
    });
  }
  if(state.reportsTab==='bs'){
    const bs = computeBS(period.end);
    makeChart('bs-chart', {
      type: 'doughnut',
      data: {
        labels: ['Total Assets','Total Liabilities',"Owner's Equity"],
        datasets: [{data: [bs.totalAssets, bs.totalLiabilities, Math.max(0,bs.equity)], backgroundColor: ['#0fb981','#f4406a','#7c5cff']}]
      },
      options: {responsive:true, maintainAspectRatio:false}
    });
  }
  document.querySelectorAll('[data-report-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.reportsTab = btn.dataset.reportTab; render(); });
  });
  document.querySelectorAll('[data-period-mode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mode = btn.dataset.periodMode;
      if(mode === 'custom'){
        const cur = currentPeriod();
        state.reportsPeriod = {mode:'custom', start: cur.start, end: cur.end};
      } else {
        state.reportsPeriod = {mode};
      }
      render();
    });
  });
  document.getElementById('reports-custom-apply')?.addEventListener('click', ()=>{
    const start = document.getElementById('reports-custom-start').value;
    const end = document.getElementById('reports-custom-end').value;
    if(!start || !end || start>end){ toast('Enter a valid date range.'); return; }
    state.reportsPeriod = {mode:'custom', start, end};
    render();
  });
  document.getElementById('budget-form')?.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const tag = document.getElementById('budget-tag').value.trim();
    const type = document.getElementById('budget-type').value;
    const monthly_amount = parseFloat(document.getElementById('budget-amount').value) || 0;
    if(!tag){ toast('Enter a tag.'); return; }
    const {error} = await sb.from('cc_budgets').upsert({
      company_id: state.company.id, tag, type, monthly_amount
    }, {onConflict: 'company_id,tag,type'});
    if(error){ toast(error.message); return; }
    await refreshAll(); render(); toast('Budget line saved.');
  });
  document.querySelectorAll('[data-del-budget]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Remove this budget line?')) return;
      await sb.from('cc_budgets').delete().eq('id', btn.dataset.delBudget);
      await refreshAll(); render();
    });
  });
  document.getElementById('financials-form')?.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fileInput = document.getElementById('financials-file');
    const file = fileInput.files[0];
    if(!file){ toast('Choose a file.'); return; }
    const period = document.getElementById('financials-period').value.trim();
    const notes = document.getElementById('financials-notes').value.trim() || null;
    const path = `${state.company.id}/${Date.now()}_${file.name}`;
    const {error: upErr} = await sb.storage.from('financials').upload(path, file);
    if(upErr){ toast(upErr.message); return; }
    const {error: rowErr} = await sb.from('cc_financial_statements').insert({
      company_id: state.company.id,
      period_label: period,
      file_path: path,
      file_name: file.name,
      notes,
      uploaded_by: state.user.id
    });
    if(rowErr){ toast(rowErr.message); return; }
    await refreshAll(); render(); toast('Signed financials uploaded.');
  });
  document.querySelectorAll('[data-view-financial]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const s = (state.financialStatements||[]).find(x=>x.id===btn.dataset.viewFinancial);
      if(!s) return;
      const {data, error} = await sb.storage.from('financials').createSignedUrl(s.file_path, 300);
      if(error || !data){ toast((error&&error.message)||'Could not open file.'); return; }
      window.open(data.signedUrl, '_blank');
    });
  });
  document.querySelectorAll('[data-del-financial]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Delete this signed financials record?')) return;
      const s = (state.financialStatements||[]).find(x=>x.id===btn.dataset.delFinancial);
      await sb.from('cc_financial_statements').delete().eq('id', btn.dataset.delFinancial);
      if(s) await sb.storage.from('financials').remove([s.file_path]);
      await refreshAll(); render();
    });
  });
}

        <div class="modal-actions"><button type="button" class="btn secondary" id="member-cancel">Cancel</button><button type="submit" class="btn" id="member-submit">Invite</button></div>
      </form>
    </div></div>` : ''}
  `;
}
function toggleMemberPermFields(){
  const isStaffRole = document.getElementById('member-role').value === 'staff';
  document.getElementById('member-permissions-field').classList.toggle('hidden', !isStaffRole);
}
function resetMemberForm(){
  document.getElementById('member-edit-id').value = '';
  document.getElementById('member-email').value = '';
  document.getElementById('member-email').disabled = false;
  document.getElementById('member-role').value = 'staff';
  document.querySelectorAll('.member-module').forEach(cb=>cb.checked=false);
  document.getElementById('member-can-approve').checked = false;
  document.getElementById('member-modal-title').textContent = 'Invite Member';
  document.getElementById('member-modal-hint').textContent = "Enter the email they'll sign up (or already have an account) with. They'll get access automatically next time they log in.";
  document.getElementById('member-submit').textContent = 'Invite';
  toggleMemberPermFields();
}
function attachTeamHandlers(){
  const backdrop = document.getElementById('member-modal-backdrop');
  document.getElementById('add-member-btn')?.addEventListener('click', ()=>{
    resetMemberForm();
    backdrop.classList.remove('hidden');
  });
  document.getElementById('member-cancel')?.addEventListener('click', ()=>backdrop.classList.add('hidden'));
  document.getElementById('member-modal-close')?.addEventListener('click', ()=>backdrop.classList.add('hidden'));
  document.getElementById('member-role')?.addEventListener('change', toggleMemberPermFields);
  document.querySelectorAll('[data-edit-member]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const m = state.members.find(x=>x.id===btn.dataset.editMember);
      if(!m) return;
      resetMemberForm();
      document.getElementById('member-edit-id').value = m.id;
      document.getElementById('member-email').value = m.email;
      document.getElementById('member-email').disabled = true;
      document.getElementById('member-role').value = m.role;
      const mods = (m.permissions && m.permissions.modules) || [];
      document.querySelectorAll('.member-module').forEach(cb=>{ cb.checked = mods.includes(cb.value); });
      document.getElementById('member-can-approve').checked = !!(m.permissions && m.permissions.can_approve);
      document.getElementById('member-modal-title').textContent = 'Manage ' + m.email;
      document.getElementById('member-modal-hint').textContent = "Update this member's role and, if they're staff, which modules they can access.";
      document.getElementById('member-submit').textContent = 'Save Changes';
      toggleMemberPermFields();
      backdrop.classList.remove('hidden');
    });
  });
  document.getElementById('member-form')?.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const role = document.getElementById('member-role').value;
    const editId = document.getElementById('member-edit-id').value;
    let permissions = {};
    if(role === 'staff'){
      const modules = [...document.querySelectorAll('.member-module:checked')].map(cb=>cb.value);
      permissions = { modules, can_approve: document.getElementById('member-can-approve').checked };
    }
    if(editId){
      const {error} = await sb.from('cc_company_members').update({ role, permissions }).eq('id', editId);
      if(error){ toast(error.message); return; }
      await refreshAll(); render(); toast('Member updated.');
    } else {
      const {error} = await sb.from('cc_company_members').insert({
        company_id: state.company.id,
        email: document.getElementById('member-email').value.trim().toLowerCase(),
        role, permissions,
        status: 'pending'
      });
      if(error){ toast(error.message); return; }
      await refreshAll(); render(); toast('Invited.');
    }
    document.getElementById('member-modal-backdrop').classList.add('hidden');
  });
  document.querySelectorAll('[data-del-member]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Remove this team member?')) return;
      await sb.from('cc_company_members').delete().eq('id', btn.dataset.delMember);
      await refreshAll(); render();
    });
  });
}
</script>
</body>
</html>
